default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.dsh/cordis\.patch\.yml$
      - id: check-yaml
        name: Check Cordis YAML syntax
        files: ^\.dsh/cordis\.patch\.yml$
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-ast
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: ci-parity-inplace
        name: CI parity, in place (lint + tests, same commands as CI)
        entry: bash -lc 'PATH="$HOME/.pixi/bin:$PATH" pixi run lint && PATH="$HOME/.pixi/bin:$PATH" pixi run test -q'
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
      - id: ci-parity-clean-export
        name: CI parity, clean export (what the runner actually sees)
        entry: bash -lc 'PATH="$HOME/.pixi/bin:$PATH" pixi run ci-local'
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
