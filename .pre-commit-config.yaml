default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.dsh/cordis\.patch\.yml$
      - id: check-yaml
        name: Check Cordis YAML syntax
        files: ^\.dsh/cordis\.patch\.yml$
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-ast
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: ci-parity-inplace
        name: CI parity, in place (lint, the command CI runs)
        entry: bash benchmarks/run_with_pixi.sh lint
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
      - id: ci-parity-inplace-tests
        name: CI parity, in place (tests, the command CI runs)
        entry: bash benchmarks/run_with_pixi.sh test -q
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
      - id: ci-parity-clean-export
        name: CI parity, clean export (what the runner actually sees)
        entry: bash benchmarks/run_with_pixi.sh ci-local
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
