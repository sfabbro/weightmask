[workspace]
name = "weightmask"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
streak-sweep = "python benchmarks/streak_stage_sweep.py --stride 1 --out test_outputs/perf/streak_stage_sweep.json"
# Stage marginal-value grid. Pass extra args through, e.g.
#   pixi run streak-recall-floor -- --disable contours
#   pixi run streak-recall-floor -- --disable ransac
streak-recall-floor = "python benchmarks/streak_recall_floor.py --out test_outputs/perf/recall_floor_dashed.json"
# The one harness that measures a non-sidereal frame, where every star is a trail.
# The synthetic fixture needs no downloads; --frame real needs an exposure on disk.
streak-nonsidereal = "python benchmarks/streak_nonsidereal_acceptance.py --quick --out test_outputs/perf/streak_nonsidereal_acceptance.json"
# The length window star_trail_veto trades against: parallel satellite vs the
# field's own chains, both in measured family-length multiples.
streak-veto-window = "python benchmarks/star_trail_veto_window.py --out test_outputs/perf/star_trail_veto_window.json"
exposure-time = "python benchmarks/exposure_time.py"
ci-local = "python benchmarks/ci_local.py"
release-check = "python benchmarks/release_check.py"
lint = "ruff check ."
format = "ruff format ."
test = "pytest"
benchmark-synthetic = "python -m tests.benchmarks.run --suite synthetic_v2 --with-baselines"
benchmark-megacam = "python -m tests.benchmarks.run --suite megacam_real"
benchmark-acs = "python -m tests.benchmarks.run --suite acs_compare"
example-complex = "python -m examples.complex_simulation_example"
science-gate = "python benchmarks/science_gate.py"

[dependencies]
python = "3.13.*"
numpy = "*"
astropy = "*"
scikit-image = "*"
sep = "*"
pyyaml = "*"
fitsio = "*"
scipy = "*"
astroscrappy = "*"
astroquery = "*"
ruff = "*"
pytest = "*"
pre-commit = "*"

[pypi-dependencies]
weightmask = { path = ".", editable = true }
