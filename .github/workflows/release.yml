name: Release

# One button. Takes a version, proves the tree is releasable, tags it, publishes
# the artifacts to PyPI, and writes the release notes from CHANGELOG.md.
#
# The validating logic is not in this file. It is benchmarks/release_check.py,
# which runs locally with `pixi run release-check -- --version X.Y.Z` and is
# exercised on every CI run. A workflow is the one place where a mistake is
# expensive and invisible until it has published something, so this one only
# orchestrates.
#
#   Actions -> Release -> Run workflow -> type the version -> Run.
#
# `release: published` is deliberately NOT a trigger. Having both a manual
# dispatch and a release trigger means a release published from the GitHub UI
# would publish to PyPI a second time, and trusted publishing would reject it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.1 (must already be in pyproject.toml, _version.py and CHANGELOG.md)"
        required: true
        type: string
      dry_run:
        description: "Validate and build, but do not tag, publish, or create a release"
        required: false
        type: boolean
        default: true
      evidence_b64:
        description: "Base64 of the qualified release-evidence JSON from a local science-gate on this commit. Required when dry_run is false."
        required: false
        type: string
        default: ""

jobs:
  release:
    # One at a time. Two concurrent releases could tag the same commit or race
    # on the PyPI project.
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/weightmask
    permissions:
      contents: write   # to create the tag and the release
      id-token: write   # trusted publishing to PyPI
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_DRY_RUN: ${{ inputs.dry_run }}
      RELEASE_EVIDENCE: test_outputs/harness/release-evidence.json
    steps:
      - name: Check release source
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$GITHUB_REPOSITORY" != "astroai/weightmask" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publishing requires astroai/weightmask on main. Use a dry run for other repositories or branches."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # release_check refuses a dirty tree, and it checks that CHANGELOG.md
          # already has the section for this version. So the release notes and
          # the version bump must be committed on the branch, reviewed, and
          # merged before this runs -- not written by this workflow.
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f
        with:
          locked: true
          cache: true

      - run: pixi run lint
      - run: pixi run test

      - name: Emit release evidence
        if: ${{ inputs.dry_run }}
        run: pixi run science-gate -- --version "$RELEASE_VERSION" --manifest "$RELEASE_EVIDENCE"

      - name: Install supplied release evidence
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_EVIDENCE_B64: ${{ inputs.evidence_b64 }}
        run: |
          if [ -z "$RELEASE_EVIDENCE_B64" ]; then
            echo "::error::Publishing requires evidence_b64 from a local science-gate on this commit. A runner without MegaCam data cannot qualify the release."
            exit 1
          fi
          mkdir -p "$(dirname "$RELEASE_EVIDENCE")"
          printf '%s' "$RELEASE_EVIDENCE_B64" | base64 -d > "$RELEASE_EVIDENCE"

      - name: Validate release evidence
        if: ${{ !inputs.dry_run }}
        run: pixi run release-check -- --version "$RELEASE_VERSION" --evidence "$RELEASE_EVIDENCE" --skip-build --require-qualified

      - name: Validate the release
        run: pixi run release-check -- --version "$RELEASE_VERSION" --evidence "$RELEASE_EVIDENCE" --outdir dist

      - name: Save validated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weightmask-${{ inputs.version }}
          path: |
            dist/*
            weightmask/weightmask.yml
            test_outputs/harness/release-evidence.json
          if-no-files-found: error

      - name: Fail if the tag already exists
        if: ${{ !inputs.dry_run }}
        run: |
          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::v$RELEASE_VERSION already exists. Bump the version instead."
            exit 1
          fi

      - name: Tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "weightmask $RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Extract the changelog section for this release
        if: ${{ !inputs.dry_run }}
        id: notes
        # Uses the same function the check used, so the notes cannot drift from
        # what was validated. An inline copy of this regex was the one place the
        # two could disagree -- and did, emitting the heading's date fragment as
        # the first line of the release body.
        # `pixi run python`, not a bare `python`: this job installs pixi but no
        # setup-python, so nothing puts a `python` on PATH. A bare `python`
        # fails with "command not found" before the notes are ever written.
        run: |
          pixi run python - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location("release_check", "benchmarks/release_check.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          version = os.environ["RELEASE_VERSION"]
          body = module.changelog_section(version)
          if not body:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print("body<<__NOTES__")
          print(body)
          print("__NOTES__")
          PY

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: weightmask ${{ inputs.version }}
          tag_name: v${{ inputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/*
            weightmask/weightmask.yml
            test_outputs/harness/release-evidence.json

      - name: Summary
        if: ${{ always() }}
        env:
          RELEASE_STATUS: ${{ job.status }}
        run: |
          if [ "$RELEASE_STATUS" != "success" ]; then
            echo "### Release $RELEASE_STATUS for $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "See the failed step before retrying. Publication may be incomplete." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RELEASE_DRY_RUN" = "true" ]; then
            echo "### Dry run for $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Built but UNQUALIFIED. Evidence is required before tagging or publishing." >> "$GITHUB_STEP_SUMMARY"
            echo "- evidence: \`$RELEASE_EVIDENCE\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run with \`dry_run: false\` to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Released $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- tag: \`v$RELEASE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- PyPI: https://pypi.org/project/weightmask/$RELEASE_VERSION/" >> "$GITHUB_STEP_SUMMARY"
          fi
