name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          locked: true
          cache: true
      - run: pixi run lint
      - run: pixi run test
      - name: Entry-point smoke
        # Version is asserted against its single declaration rather than a
        # literal. A hardcoded copy here was still on 0.1.0 and failed every
        # push after the 0.2.0 bump.
        run: |
          pixi run python -c "from weightmask.cli import run_pipeline; from weightmask.reconstruct_sky import main"
          pixi run python -c "import weightmask; from weightmask._version import __version__; assert weightmask.__version__ == __version__"

  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -c "import importlib.metadata as metadata; import weightmask; from weightmask.cli import run_pipeline; from weightmask.reconstruct_sky import main; assert metadata.version('weightmask') == weightmask.__version__; print(weightmask.__version__)"
        working-directory: /tmp

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          "numpy==1.25.2"
          "astropy==5.0.4"
          "fitsio==1.3.0"
          "scipy==1.9.3"
          "scikit-image==0.20.0"
          "sep==1.2.1"
          "PyYAML==6.0"
          "astroscrappy==1.2.0"
          "pytest==7.4.4"
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python -m pytest tests/test_minimum_dependencies.py tests/test_contract.py tests/test_utils.py -q

  torchfits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[torchfits]"
      - run: python -m pip install pytest
      - run: python -m pip check
      - run: python -c "from weightmask.torchfits_adapter import torchfits_available; assert torchfits_available()"
      - run: python -m pytest tests/test_contract.py -k real_torchfits -q
