# Canonical configuration for the WeightMask masking and weight-map pipeline.

flat_masking:
  local_filter_size: 15
  local_low_thresh: 0.5
  local_high_thresh: 2.0
  col_enable: true
  col_deriv_sigma: 10.0
  col_dead_thresh: 0.1
  # Whole-CCD veto: an HDU whose flat median is an outlier vs its siblings
  # (dead CCD / Elixir-blanked) is flagged fully BAD instead of partially.
  dead_ccd_enable: true
  dead_ccd_mad_sigma: 5.0
  dead_ccd_min_rel_dev: 0.10
  dead_ccd_min_hdus: 8
  dead_ccd_badpix_fraction: 0.9

dark_masking:
  # Optional hot-pixel leg: used only with --dark_image; OR'd into BAD.
  # Thresholds mirror flat_masking; darks are background-dominated so the
  # high-ratio tail does the work.
  local_filter_size: 15
  local_low_thresh: 0.5
  local_high_thresh: 2.0
  col_enable: true
  col_deriv_sigma: 10.0
  col_dead_thresh: 0.1

saturation:
  method: "histogram"
  # Per-instrument fallback list (first present header wins). MegaPrime uses
  # SATURATE; other optical instruments use SATUR/SATURAT variants.
  keyword: ["SATURATE", "SATUR", "SATURAT"]
  effective_full_scale: 65535.0
  histogram_params:
    hist_min_adu: 30000
    hist_max_adu: null
    guard_fraction: 0.75
    max_upper_factor: 1.05
    plateau_percentile: 99.8
    min_tail_pixels: 8
  bleed_adaptive_cap: false
  bleed_cap_core_factor: 3.0
  bleed_cap_min: 20
  bleed_cap_max: 200
  mask_bleed_trails: true
  bleed_thresh_sigma: 5.0
  bleed_grow_vertical: 50
  bleed_grow_horizontal: 2
  fallback_level: 65000.0

sep_background:
  method: "sep"
  box_size: 128
  auto_box_scaling: true
  filter_size: 3
  iterations: 2
  mask_threshold: 0.8
  max_box_size: 1024
  median_kernel_size: 31
  smooth_surface_fallback: true

cosmic_ray:
  sigclip: 8.5
  objlim: 15.0
  niter: 2
  dynamic_sigclip: false
  dynamic_objlim: true
  psf_aware: true
  psf_fwhm_guess: 3.0
  dilate_cr: false
  dilation_radius: 0
  max_component_area: 12
  min_component_contrast_sigma: 4.0
  faint_cr:
    enable: true
    sigclip: 5.0
    objlim_boost: 1.5
    niter: 1
    min_component_area: 3
    max_component_area: 12
    min_elongation: 2.0
    min_contrast_sigma: 4.0

sep_objects:
  extract_thresh: 3.0
  min_area: 10
  deblend_nthresh: 32
  deblend_cont: 0.005
  clean: true
  clean_param: 1.0
  ellipse_k: 2.5
  seed_thresh_factor: 1.25
  dynamic_halo_scaling: true
  halo_brightness_factor: 0.15
  halo_flux_reference_percentile: 50.0
  max_halo_multiplier: 1.8
  max_elongation: 3.0
  handoff_elongated_to_streak: true
  spike_enable: true
  spike_flux_thresh: 1.0e5
  spike_length_base: 100
  spike_width: 3

streak_masking:
  enable: true
  mode: "auto_ground"
  dilation_radius: 2
  debug: false
  retry_without_existing_mask: true
  retry_if_area_fraction_exceeds: 0.03
  retry_if_support_width_exceeds: 10.0
  satdet_params:
    # Hough prescreen binning (2 = 4x fewer pixels; strip confirm stays full-res).
    # Measured: identical recall/FP vs 1 on injection harness, ~11% faster end-to-end.
    bin_factor: 2
    rescale_percentiles: [4.5, 93.0]
    gaussian_sigma: 2.0
    gaussian_sigmas: [1.5, 2.0, 3.0]
    canny_low_threshold: 0.06
    canny_high_threshold: 0.22
    small_edge_perimeter: 40
    hough_threshold: 6
    hough_min_line_length: 65
    hough_max_line_gap: 20
    hough_rng_seed: 0
    cluster_angle_tol_deg: 2.5
    cluster_rho_tol_px: 30.0
    max_transverse_rms: 8.0
    edge_buffer: 16
    min_edge_touches: 0
    min_interior_span: 70.0
    min_segment_density: 0.01
    candidate_corridor_radius: 10
    max_existing_mask_fraction: 0.8
    max_candidates: 8
    min_segment_accept: 2
    confidence_threshold: 0.22
  houghpeak_params:
    enable: true
    bin: 4
    thresh_sig: 2.5
    min_votes: 100
    max_candidates: 6
  contour_params:
    enable: true
    thresh_sig: 2.5
    min_span: 150.0
    shape_cut: 0.2
    area_cut: 100.0
    radius_dev_cut: 0.5
  mrt_rescue_params:
    theta_step_deg: 2.0
    peak_threshold_sig: 4.2
    max_candidates: 4
    confidence_threshold: 0.25
  mask_params:
    strip_length: 256
    strip_width: 80
    profile_sigma_threshold: 1.5
    profile_percentile: 72.0
    rotation_interpolation_order: 1
    padding: 2
    min_mask_pixels: 24
    min_row_hits: 4
    min_row_hit_fraction: 0.20
    min_col_hit_fraction: 0.10
    max_support_width: 12
  enable_sparse_ransac: true
  sparse_on_primary_weak_only: true
  sparse_ransac_params:
    detect_thresh_sig: 6.0
    residual_threshold: 1.5
    min_inliers: 25
    min_length: 100
    min_line_density: 0.6
    dilation_radius: 1
    max_trials: 300
    max_trails: 3
  frangi_legacy_params:
    block_size: 1024
    block_pad: 32
    tophat_radius: 10
    sigmas: [1, 2, 4]
    black_ridges: false
    high_threshold: null
    low_threshold: null
    high_threshold_sig: 8.0
    low_threshold_sig: 3.0
    min_area: 25
    min_elongation: 5.0

variance:
  method: "theoretical"
  # Per-instrument fallback lists (first present header wins). MegaPrime uses
  # GAIN/RDNOISE; other instruments use GAINA/GAINB/CCDGAIN, RDNOIS/RON, etc.
  gain_keyword: ["GAIN", "GAINA", "GAINB", "CCDGAIN"]
  rdnoise_keyword: ["RDNOISE", "RDNOIS", "RON"]
  # Fallbacks only (not assumptions): used when no keyword above is present.
  default_gain: 1.5
  default_rdnoise: 5.0
  epsilon: 1.0e-9
  # Master-flat fractional uncertainty (Elixir stack ballpark). Adds a
  # (sky_e*rel)^2 term, vignette-scaled, so edge weights stay honest.
  flat_rel_noise: 0.003
  rescale_variance: true
  unbias_variance: false

confidence_params:
  dtype: "float32"
  normalize_percentile: 99.0
  # per_hdu (legacy) or per_exposure (comparable across CCDs; rescale pass
  # at end of exposure; skipped unless output_map_format=confidence).
  normalize_scope: per_exposure
  scale_to_100: false

output_params:
  output_map_format: "weight"
  mask_detected_in_weight: false
  # Wire format: mask uint16 (BITPIX 16, values 0-63 fit 6 contract bits),
  # ivar/weight/confidence/sky float32 (BITPIX -32; float16 loses edge terms
  # and Rice does not support it). Measured: mask u32 39MB -> u16 19.6MB,
  # fz 0.7MB; ivar f32 39MB -> fz ~17MB on 2112x4644 HDUs.
  mask_bitpix: 16
  ivar_bitpix: 32
  # Rice (fz) compression; archive sets true for *.fits.fz landing.
  compress: false
