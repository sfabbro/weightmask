# Canonical WeightMask config packaged with the library.
# Extra top-level keys fail validation. See docs/usage.md and docs/algorithms.md.

flat_masking:
  local_filter_size: 15          # pixels; median box for the local flat surface
  local_low_thresh: 0.5          # flag if flat / local-median is below this ratio
  local_high_thresh: 2.0         # flag if flat / local-median is above this ratio
  col_enable: true               # mark dead columns from the column-median derivative
  col_deriv_sigma: 10.0          # MAD-sigma threshold on that derivative
  col_dead_thresh: 0.1           # also flag columns whose median is this low vs the chip
  dead_ccd_enable: true          # MEF: flag a whole HDU whose flat median is a sibling outlier
  dead_ccd_mad_sigma: 5.0        # MAD-sigma cut for that veto
  dead_ccd_min_rel_dev: 0.10     # also require this fractional deviation from the MEF median
  dead_ccd_min_hdus: 8           # skip the veto on small MEFs (too few siblings)
  dead_ccd_badpix_fraction: 0.9  # if already this fraction BAD, treat the CCD as dead
  bad_mask_cache: true           # reuse each flat HDU's bad-pixel mask across exposures
                                 # (~20 s per 9.8 Mpix HDU otherwise); the key covers the
                                 # flat's path/size/mtime, HDU index, shape and every setting
                                 # above; v4 masks are tile-size independent.
  bad_mask_cache_dir: null       # null → <flat directory>/.weightmask_cache

dark_masking:
  hot_sigma: 8.0                # hot if dark > median + hot_sigma * 1.4826*MAD; non-finites are BAD
                                # assumes a mostly healthy HDU with uniform dark pedestal

saturation:
  keyword: ["SATURATE", "SATUR", "SATURAT"]  # header advisory (first present); used if the clump fails the guard
  effective_full_scale: 65535.0  # ADU; 16-bit ceiling used as a histogram bound
  histogram_params:
    hist_min_adu: 30000          # ADU; ignore the sky peak when hunting the sat clump
    hist_max_adu: null           # ADU; null → 1.01 × the frame maximum
    guard_fraction: 0.75         # keep the clump only if it sits this far into the tail
    max_upper_factor: 1.05       # reject clumps above this × the expected full scale
    min_tail_pixels: 8           # need at least this many pixels in the sat clump
  bleed_adaptive_cap: false      # if true, cap bleed growth from the saturated-core height
  bleed_cap_core_factor: 3.0     # adaptive cap ≈ factor × core column extent
  bleed_cap_min: 20              # pixels; floor on the adaptive cap
  bleed_cap_max: 200             # pixels; ceiling on the adaptive cap
  mask_bleed_trails: true        # grow SAT along the column (blooming, both directions)
  bleed_thresh_sigma: 5.0        # stop growing when data fall this many σ toward sky
  bleed_grow_vertical: 50        # pixels; maximum growth up or down from a sat core
  bleed_grow_horizontal: 2       # pixels; extra width around the bleed column
  fallback_level: 65000.0        # ADU; candidate for the guarded full-scale bound

sep_background:
  method: "sep"                  # "sep", "median_filter", or "robust_median_fallback"
  box_size: 128                  # pixels; SEP mesh box (bw/bh)
  auto_box_scaling: true         # grow the box on large CCDs, capped by max_box_size
  filter_size: 3                 # SEP mesh-filter width (fw/fh)
  iterations: 2                  # object-mask / background refinement loops; 0 disables them
  mask_threshold: 0.8            # masked-fraction cut; above this, skip the mesh and use global SEP
  max_box_size: 1024             # pixels; cap for auto_box_scaling
  median_kernel_size: 31         # pixels; kernel if method is median_filter
  smooth_surface_fallback: true  # if SEP fails, fall back rather than crash
  dip_repair_enable: true        # fill mesh undershoots next to bright masks when data agree
  dip_repair_sigma: 5.0          # how large a dip (in sky-RMS) is eligible for repair
  dip_repair_max_fraction: 0.05  # abort repair if more than this fraction of the CCD would change
  edge_artifact_thresh: 50.0     # edge-vs-centre median gap (ADU) that triggers Gaussian smoothing

cosmic_ray:
  sigclip: 8.5                   # historical shipped value; fixed dimensionless L.A.Cosmic significance
  objlim: 15.0                   # contrast vs neighboring objects (stellar-core veto)
  niter: 2                       # astroscrappy iterations
  dynamic_objlim: true           # raise objlim when the PSF looks undersampled
  psf_aware: true                # extra peakiness gate so stars are not taken as CRs
  psf_fwhm_guess: 3.0            # pixels; FWHM used by that gate
  dilate_cr: false               # extra morphological grow of CR (usually off)
  dilation_radius: 0             # pixels; used only if dilate_cr
  max_component_area: 12         # drop CR islands larger than this (likely stars/bleed)
  min_component_contrast_sigma: 4.0  # keep a CR island only if peak SNR exceeds this
  single_pass: false             # fold the faint pass into one astroscrappy run (needs niter > 0 and faint_cr)
  sepmed: true                   # astroscrappy separable median (faster, same masks)
  cleantype: "meanmask"          # astroscrappy cleantype: median, medmask, meanmask or idw
  fsmode: "median"               # astroscrappy fine-structure mode: median or convolve
  psffwhm: 2.5                   # pixels; astroscrappy PSF FWHM (used by fsmode convolve)
  psfsize: 7                     # pixels, odd; astroscrappy PSF kernel size
  faint_cr:
    enable: true                 # second, fainter pass for elongated multi-pixel hits
    enhancement: "lacosmic"      # lacosmic (default) or opt-in residual prototype
    sigclip: 5.0                 # lower, more permissive L.A.Cosmic threshold than the primary pass
    objlim_boost: 1.5            # multiply objlim on this pass
    niter: 1                     # one extra astroscrappy pass
    min_component_area: 3        # drop single/double-pixel noise
    max_component_area: 12       # still reject large islands
    min_elongation: 2.0          # keep only elongated "worms"
    min_contrast_sigma: 4.0      # vs local sky RMS
    residual:
      threshold_sig: 4.0         # residual threshold for the opt-in sparse path
      min_component_area: 4
      max_component_area: 12
      min_elongation: 4.0
      min_contrast_sigma: 4.0

sep_objects:
  extract_thresh: 3.0            # SEP detection threshold in sky-RMS units
  min_area: 10                   # pixels; SEP minarea
  deblend_nthresh: 32            # SEP deblend_nthresh
  deblend_cont: 0.005            # SEP deblend_cont (lower → more splitting)
  clean: true                    # SEP clean of spurious detections
  clean_param: 1.0               # SEP clean_param
  ellipse_k: 3.0                 # ellipse mask radius in Kron-like units
  seed_thresh_factor: 1.25       # multiply extract_thresh for first-pass seed extraction
  dynamic_halo_scaling: true     # grow ellipses for brighter objects
  halo_brightness_factor: 0.2    # how fast the halo grows with flux
  halo_flux_reference_percentile: 50.0  # flux percentile treated as "typical"
  max_halo_multiplier: 2.0       # cap on that growth
  mask_dilation_radius: 2        # pixels; extra grow to cover halo fringes
  max_elongation: 3.0            # a/b above this can be withheld from DETECTED
  handoff_elongated_to_streak: true  # send those to the streak stage instead
  spike_enable: true             # axis-aligned diffraction-spike bars
  spike_flux_thresh: 1.0e+5      # ADU; only objects brighter than this get spikes
  spike_length_base: 100         # pixels; half-length of the bar
  spike_width: 3                 # pixels; bar thickness

streak_masking:
  enable: true                   # STREAK bit: binned Hough peaks + contours + strip refine + optional RANSAC
  profile_accept: true           # keep only the fitted line; drop components wider than max_support_width
  houghpeak_params:
    enable: true                 # binned Hough-peak extractor
    bin: 4                       # spatial binning before the peak search
    thresh_sig: 2.5              # peak significance in the Hough accumulator
    min_votes: 100               # minimum accumulator votes
    max_candidates: 6            # cap
    confidence_threshold: 0.40   # minimum candidate score to accept a refined peak
  contour_params:
    enable: true                 # elongated-contour extractor
    thresh_sig: 2.5              # binary threshold in sky-RMS units
    min_span: 150.0              # pixels; minimum long axis
    shape_cut: 0.2               # compactness; reject round blobs
    area_cut: 100.0              # pixels; minimum contour area
    radius_dev_cut: 0.5          # reject contours that look circular
    confidence_threshold: 0.40   # minimum candidate score to accept a refined contour
  # mrt_rescue_params removed. The Radon rescue was the sensitive stage -- the
  # one meant to find what the cheap prescreen misses. Measured before removal:
  # over 83 real amps it accepted on 3, all three false positives, while
  # houghpeaks explained the historical real detections; on injected trails at
  # 4/6/8/12 sigma, two lengths, two seeds it moved recall_line by +0.000 in 8 of
  # 8 cells. It cost 121.7 s/amp of a 125.7 s/amp stage. The `bin` recall table
  # that used to live here was measured on the non-production input path and is
  # withdrawn -- see benchmarks/streak_recall_floor.py and benchmarks/streak_stage_sweep.py.
  mask_params:
    strip_length: 256            # pixels; trail-aligned stamp length
    strip_width: 80              # pixels; stamp width for the profile
    profile_sigma_threshold: 1.5 # grow the mask where the cross-trail profile exceeds this
    profile_percentile: 72.0     # robust level of that profile
    rotation_interpolation_order: 1  # ndimage rotate order (1 = bilinear)
    padding: 2                   # pixels; extra margin around the refined strip
    min_mask_pixels: 24          # reject trails with fewer pixels than this
    min_row_hits: 4              # along-trail occupancy gate
    min_row_hit_fraction: 0.20   # fraction of rows that must contain mask
    min_col_hit_fraction: 0.10   # fraction of columns that must contain mask
    max_support_width: 12        # pixels; reject if the refined trail is wider
    max_premasked_fraction: 0.25 # drop a streak component lying mostly in the upstream
                                 # mask: it is not a new finding. Unconfirmed linear features
                                 # sit at 0.02 on MegaCam; saturated-star bleed at 0.45.
    # OPTIONAL brightness veto. Set to null to disable it entirely.
    #
    # Drop a component whose p90 exceeds this many background RMS. Measured on
    # MegaCam, in sigma: unconfirmed linear features 3.0 and 3.2; saturated-star bleed
    # 1138 and 1345; hot column group ~2000; bright star arm 155.
    #
    # UNCALIBRATED AT THE HIGH END. 20 is a 6x margin above the two trails that
    # exist locally -- a sample of two. A bright satellite constellation would be
    # deleted by this rule, and nothing in the local corpus would ever show it.
    # Raise it, or null it, if that matters more than the artefacts below.
    #
    # Historical 0.2.0 veto measurements preceded the 0.2.1 object-mask fixes.
    # Correct upstream masks now suppress some of those artefacts on their own;
    # old per-component pixel counts do not describe the current pipeline.
    #
    # The column is also catchable without brightness: it is static, so it
    # persists at 0.90 across epochs of the same field, against 0.02 for a real
    # trail. `--persistence` uses that. The star arm persists at only 0.41 and is
    # not reliably caught that way.
    max_component_sigma: 20.0
    max_row_gap: 24              # Hough only: group support across short gaps from star masks
    min_row_run: 8               # reject short noise runs before grouping; gaps stay unfilled
    angle_fan_slack: 13.0        # pixels; support up to max_support_width + this retries +-0.25..1 deg rotations
  # OPTIONAL star-trail-family veto: drop a chain of the field's own star trails.
  # Set enable: false to disable it entirely.
  #
  # On a non-sidereal frame every star is trailed, so "long, thin and straight"
  # stops being evidence. Measured on the 2026-10-14 campaign, the dominant
  # diagonal false positive is two or more star trails near-collinear enough for
  # the RANSAC pass to draw a line between their heads: on 1851960 HDU 17 a
  # 931 px component at 40.2 deg while the field's own trails are 55 px, its
  # pixels at sky level with four bright heads along it. A satellite trail has
  # its own angular rate, so two properties separate the classes and both are
  # measurable per frame: alignment with the frame's *own* trail angle, and a
  # span no longer than a small multiple of the family's length. The length
  # condition is what protects a satellite flying parallel to the field's motion
  # (1774908 HDU 19 sat 1.8 deg off the field angle), so raising length_factor
  # trades these false positives for that sensitivity.
  #
  # MEASURED, not designed (benchmarks/star_trail_veto_window.py, 1024-px
  # synthetic non-sidereal fixture, 55 px star trails, family measured at 47 px):
  #   a trail parallel to the field is dropped while it is under 189.0 px: the
  #   crossing bisects at 3.985x the family's measured length, which is this
  #   length_factor to within 0.4%, so the config sets exactly the boundary it
  #   claims to. Length follows the trail's own angular rate, so a satellite
  #   flying parallel to the field's motion inside ~3.4 star-trail lengths is
  #   lost to this rule by design.
  #   the 10 deg tolerance measures 9.1 deg inside, 11.1 deg outside.
  #   a GAPPED chain (the campaign's geometry) is dropped at every span to 21x:
  #   each gap leaves its own component at ~1.15x, and on the 8-segment case the
  #   stage's 778 px of chain in the mask falls to 0 (14,123 -> 7,370 px).
  #   a CONTIGUOUS chain is one component, so it is dropped inside the same
  #   window and survives outside it: length cannot separate it from a parallel
  #   satellite. "A chain cannot outgrow the trails it is made of" holds for the
  #   gapped case only -- see CHANGELOG's Known limitations.
  #   the injected parallel trail does not move the family it is judged against
  #   (47.2-47.3 px, angle within 0.02 deg, at 2x, 4x and 8x).
  #
  # The family is estimated once per HDU. On a sidereal frame there is no shared
  # angle -- cosmic rays, saturated-star bleed and galaxies have every
  # orientation -- so the estimator returns None and this veto stays inert; that
  # is why it can ship enabled. The acceptance harness
  # (benchmarks/streak_nonsidereal_acceptance.py) is its gate: it injects a
  # satellite at a known offset from the family angle, and negative star trails,
  # chains and detector bands. Measured on that matrix 2026-10-14 (24 cells, 3
  # seeds): the flat-less 1851960 HDU 17 crop's STREAK footprint falls from
  # 4,379 px to 0 px on every seed, no injected cell changes at any sigma or
  # offset, and a sidereal frame of round stars yields no family at all, so
  # sidereal masks are unchanged. `--set
  # streak_masking.star_trail_veto.enable=false` reproduces the pre-veto numbers
  # on the same code.
  star_trail_veto:
    enable: true
    thresh_sig: 2.5              # sky-RMS units; elongated-source threshold
    min_sources: 20              # fewer elongated sources in a mode than this = no family
    mode_window_deg: 10.0        # full width of the dominant-mode orientation window
    max_angle_spread_deg: 10.0   # MAD of the family's angles must be under this
    min_elongation: 3.0          # major/minor axis ratio of a trailed source
    min_length: 8.0              # pixels; ignore sources shorter than this
    angle_tol_deg: 10.0          # component must be this close to the family angle
    length_factor: 4.0           # and no longer than this multiple of the family's median length
  enable_sparse_ransac: true     # dashed-trail recovery on residual bright pixels
  sparse_ransac_params:
    detect_thresh_sig: 6.0       # residual pixels this many σ above sky
    residual_threshold: 1.5      # pixels; RANSAC inlier distance
    min_inliers: 25              # minimum inliers to keep a line
    min_length: 128              # pixels; rejects a measured persistent 116 px detector feature
    min_line_density: 0.6        # inliers per pixel of length
    dilation_radius: 1           # pixels; grow each RANSAC trail
    max_trials: 300              # RANSAC iterations
    max_trails: 3                # stop after this many residual lines
    # Cost bounds for crowded fields. Both are inert on the fields this stage
    # was tuned on (2.3-4.6k candidates and tens of rejected models per HDU)
    # and bind only where the loop is otherwise unbounded: on non-sidereal
    # MegaCam frames the 6-sigma residual set reached 154-236k pixels per HDU,
    # where RANSAC cost per pass grows with the candidate count and rejections
    # are bounded only by candidates/min_inliers -- measured at ~6,800 passes of
    # ~3.5 s each on one core, and the same HDU took 24 passes locally against
    # 230+ on a pod. max_candidates bounds the fit (a model is still re-scored
    # against every candidate, so the cap cannot hide an inlier); max_rejected
    # bounds how long a field can spend proposing models that never pass.
    max_candidates: 20000        # candidates entering each RANSAC fit
    max_rejected: 200            # rejected models per HDU before stopping

variance:
  method: "theoretical"          # "theoretical" (default), "rms_map", or "empirical_fit"
  # ivar = g^2 F^2 / (S*g*F + RN^2). A spatially varying flat moved aperture flux
  # by more than the fixture read-noise floor, so the sky term is S*g*F.
  gain_keyword: ["GAIN", "GAINA", "GAINB", "CCDGAIN"]  # e-/ADU; first present header wins
  rdnoise_keyword: ["RDNOISE", "RDNOIS", "RON"]        # e-; first present header wins
  default_gain: 1.5              # e-/ADU; used only if no gain keyword is present
  default_rdnoise: 5.0           # e-; used only if no read-noise keyword is present
  epsilon: 1.0e-9                # validity cut / safe-flat substitute; not added to the denominator
  flat_rel_noise: 0.003          # dimensionless fractional flat uncertainty; adds (S*rel_map)^2 ADU^2
  rescale_variance: true         # scale so background SNR has robust scatter 1
  empirical_patch_size: 128      # pixels; patch size for the empirical_fit regression
  empirical_clip_sigma: 3.0      # sigma clip for the empirical_fit regression

confidence_params:
  dtype: "float32"               # confidence array dtype
  normalize_percentile: 99.0     # divide weight by this percentile, then clip to [0, 1]
  normalize_scope: per_exposure  # MEF CLI only, and only if output_map_format is confidence; else ignored
  scale_to_100: false            # if true, write confidence as 0–100 instead of 0–1

output_params:
  output_map_format: "weight"    # primary -o product: "weight" or "confidence"
  mask_detected_in_weight: false # if true, DETECTED pixels also get zero weight
  mask_bitpix: 16                # FITS BITPIX for the mask (uint16; values 0–127 fit)
  ivar_bitpix: 32                # FITS BITPIX for ivar/weight/confidence/sky (float32)
  compress: false                # Rice (.fits.fz); if true and -o omitted, default suffix is .weight.fits.fz
  sky_format: full               # "full" map, or "mesh" for SKYMESH + weightmask-reconstruct-sky
