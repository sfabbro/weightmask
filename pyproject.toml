[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weightmask"
version = "0.1.0"
authors = [
  { name="Seb Fabbro", email="sebfabbro@gmail.com" },
]
description = "Per-pixel weight, mask, inverse-variance, and sky maps for astronomical FITS images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["astronomy", "FITS", "weight", "mask", "variance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "astropy",
    "fitsio",
    "scipy",
    "scikit-image",
    "sep",
    "PyYAML",
    "astroscrappy",
]

[project.urls]
Homepage = "https://github.com/astroai/weightmask"
Issues = "https://github.com/astroai/weightmask/issues"
Changelog = "https://github.com/astroai/weightmask/blob/main/CHANGELOG.md"
Source = "https://github.com/astroai/weightmask"
PyPI = "https://pypi.org/project/weightmask/"

[tool.setuptools.packages.find]
include = ["weightmask"]
exclude = ["sandbox*", "tests*", "examples*", "benchmarks*"]

# --- This section creates the command-line script ---
[project.scripts]
weightmask = "weightmask.cli:run_pipeline"
weightmask-reconstruct-sky = "weightmask.reconstruct_sky:main"

[tool.ruff]
line-length = 120
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
