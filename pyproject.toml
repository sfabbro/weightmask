[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weightmask"
version = "0.3.0"
authors = [
  { name="Seb Fabbro", email="sebfabbro@gmail.com" },
]
description = "Per-pixel weight, mask, inverse-variance, and sky maps for astronomical FITS images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["astronomy", "FITS", "weight", "mask", "variance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.25",
    "astropy>=5.0",
    "fitsio>=1.3.0",
    "scipy>=1.9",
    "scikit-image>=0.20",
    "sep>=1.2",
    "PyYAML>=6.0",
    "astroscrappy>=1.2",
]

[project.optional-dependencies]
torchfits = ["torchfits>=1.1.3"]

[project.urls]
Homepage = "https://github.com/astroai/weightmask"
Issues = "https://github.com/astroai/weightmask/issues"
Changelog = "https://github.com/astroai/weightmask/blob/v0.3.0/CHANGELOG.md"
Source = "https://github.com/astroai/weightmask"
PyPI = "https://pypi.org/project/weightmask/"

[tool.setuptools.packages.find]
include = ["weightmask"]
exclude = ["sandbox*", "tests*", "examples*", "benchmarks*"]

[tool.setuptools.package-data]
weightmask = ["weightmask.yml"]

# --- This section creates the command-line script ---
[project.scripts]
weightmask = "weightmask.cli:run_pipeline"
weightmask-reconstruct-sky = "weightmask.reconstruct_sky:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# The CANFAR manifest pins this validator's SHA-256, so it must stay byte-identical.
extend-exclude = [".pixi", "benchmarks/canfar/manifest.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts run as files put the repository root on sys.path before importing siblings.
"benchmarks/*.py" = ["E402"]
# Shipped alone to CANFAR pods, where the sibling layout differs from the repository's.
"benchmarks/canfar/plot_trail_cutouts.py" = ["PLC0415"]
"benchmarks/canfar/process_exposure.py" = ["PLC0415"]
