[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weightmask"
version = "0.1.0"
authors = [
  { name="Seb Fabbro", email="sebfabbro@gmail.com" },
]
description = "Generates weight, mask, and confidence maps for astronomical FITS images."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "astropy",
    "fitsio",
    "scipy",
    "scikit-image",
    "sep",
    "PyYAML",
    "astroscrappy",
]

[project.urls]
"Homepage" = "https://github.com/astroai/weightmask"
"Issues" = "https://github.com/astroai/weightmask/issues"

[tool.setuptools.packages.find]
exclude = ["sandbox*"]

# --- This section creates the command-line script ---
[project.scripts]
weightmask = "weightmask.cli:run_pipeline"
weightmask-reconstruct-sky = "weightmask.reconstruct_sky:main"

[tool.ruff]
line-length = 120
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
